
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Webhook Messenger</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191a20;
      --input: #111216;
      --border: #30313a;
      --text: #f4f4f6;
      --muted: #999ba8;
      --accent: #5865f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 30px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 70px #0005;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--accent);
      font-size: 25px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 13px;
      color: var(--text);
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      font: inherit;
      line-height: 1.5;
      resize: vertical;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .hint {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    button:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #status {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #status.success {
      display: block;
      color: #8cf0ad;
      background: #153322;
    }

    #status.error {
      display: block;
      color: #ffaaaa;
      background: #3b1d22;
    }

    .footer {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">
      <div class="logo">💬</div>
      <div>
        <h1>Webhook Messenger</h1>
        <p class="subtitle">Send a message directly to Discord.</p>
      </div>
    </div>

    <form id="messageForm">
      <label for="message">Your Message</label>

      <textarea
        id="message"
        maxlength="2000"
        placeholder="Type your message here..."
        required
      ></textarea>

      <p class="hint">
        <span id="charCount">0</span>/2000 characters
      </p>

      <button id="sendButton" type="submit">
        Send Message
      </button>

      <div id="status" role="status" aria-live="polite"></div>
    </form>

    <div class="footer">
      Messages are sent to the configured Discord channel.
    </div>
  </main>

  <script>
    // Fixed destination: configure your regenerated webhook URL here.
    const WEBHOOK_URL =
      "https://discord.com/api/webhooks/1559045211961958431/dmwtkl4ra0-aXAnmu3M6KAUZWlKRiiY8NuvcwkFn8hBgulmUSM7htyyxqlwkpWPqi7ed";

    const form = document.getElementById("messageForm");
    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("sendButton");
    const statusBox = document.getElementById("status");
    const charCount = document.getElementById("charCount");

    messageInput.addEventListener("input", () => {
      charCount.textContent = messageInput.value.length;
    });

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = messageInput.value;

      if (!message.trim()) {
        showStatus("Please enter a message.", "error");
        return;
      }

      if (WEBHOOK_URL.startsWith("PASTE_")) {
        showStatus(
          "Configure your webhook URL in the JavaScript first.",
          "error"
        );
        return;
      }

      sendButton.disabled = true;
      sendButton.textContent = "Sending...";
      statusBox.className = "";
      statusBox.style.display = "none";

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            content: message,
            allowed_mentions: {
              parse: []
            }
          })
        });

        if (!response.ok) {
          throw new Error(
            response.status === 429
              ? "Discord rate limit reached. Please wait and try again."
              : `Discord returned HTTP ${response.status}.`
          );
        }

        showStatus(
          "✓ Message sent successfully to Discord!",
          "success"
        );

        messageInput.value = "";
        charCount.textContent = "0";
      } catch (error) {
        showStatus(
          error instanceof TypeError
            ? "Could not connect to Discord. Check your connection or browser CORS restrictions."
            : error.message,
          "error"
        );
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send Message";
      }
    });
  </script>
</body>
</html>
